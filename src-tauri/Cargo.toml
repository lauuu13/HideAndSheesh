[package]
name = "hideandseek"
version = "1.0.0"
description = "Bagong Ilog Hide and Seek desktop shell"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["http-all", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.21"
local-ip-address = "0.6"
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "hideandseek"
path = "src/main.rs"
