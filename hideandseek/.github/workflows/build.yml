name: Build Hide & Seek Apps

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  # ---------------------------------------------------------------------
  # ANDROID BUILD (Capacitor -> Gradle -> .apk)
  # ---------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (for Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hideandseek-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # macOS DESKTOP BUILD (Tauri -> .app / .dmg)
  # ---------------------------------------------------------------------
  build-macos:
    name: Build macOS App (Tauri)
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app (universal)
        run: |
          npm run tauri build -- --target universal-apple-darwin

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: hideandseek-macos-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: hideandseek-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # OPTIONAL: attach both build outputs to a GitHub Release when a tag is pushed
  # ---------------------------------------------------------------------
  release:
    name: Publish to Release
    needs: [build-android, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hideandseek-android-apk/*.apk
            dist/hideandseek-macos-app/*.app
            dist/hideandseek-macos-dmg/*.dmg
