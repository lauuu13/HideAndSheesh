<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bagong Ilog: Hide and Seek</title>
<style>
  :root { --accent: #ffb703; --danger: #e63946; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0f14; font-family: -apple-system, Roboto, sans-serif; }
  #gameCanvas { position: fixed; inset: 0; display: block; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: linear-gradient(160deg,#0b0f14,#131b23); color: #eee; z-index: 20; }
  .hidden { display: none !important; }

  h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); text-align: center; }
  p.sub { margin: 0 0 12px; opacity: .7; font-size: 13px; text-align: center; }

  input[type=text] { width: 100%; max-width: 320px; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a3742; background: #16202a; color: #eee; font-size: 15px; }
  button { padding: 12px 18px; border-radius: 10px; border: none; background: var(--accent); color: #201400; font-weight: 700; font-size: 15px; }
  button:disabled { opacity: .4; }
  button.secondary { background: #24313d; color: #eee; }

  .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 420px; width: 100%; }
  .char-card { border: 2px solid #24313d; border-radius: 12px; padding: 10px 6px; text-align: center; background: #101820; cursor: pointer; }
  .char-card.selected { border-color: var(--accent); background: #1c2733; }
  .char-card.taken { opacity: .35; cursor: not-allowed; }
  .char-avatar { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px; }
  .char-name { font-size: 11px; line-height: 1.2; }
  .char-taken-label { font-size: 9px; color: var(--danger); margin-top: 2px; }

  .lobby-actions { display: flex; gap: 10px; width: 100%; max-width: 340px; }
  .lobby-actions button { flex: 1; }

  #browseResults { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
  .lobby-row { display: flex; justify-content: space-between; align-items: center; background: #101820; border: 1px solid #24313d; border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .lobby-row:active { background: #1c2733; }
  .lobby-row .lobby-name { font-size: 14px; font-weight: 600; }
  .lobby-row .lobby-meta { font-size: 12px; opacity: .7; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #hud .top-bar { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
  #timerPill, #rolePill { pointer-events: auto; background: rgba(0,0,0,.55); color: #fff; padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 14px; }
  #rolePill.seeker { color: var(--danger); }
  #rolePill.hider { color: #4caf50; }

  #blindOverlay { position: absolute; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; text-align: center; padding: 30px; }

  .joystick-zone { position: absolute; bottom: 26px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); pointer-events: auto; touch-action: none; }
  #moveZone { left: 22px; }
  #lookZone { right: 22px; }
  .joystick-knob { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,183,3,.85); top: 50%; left: 50%; transform: translate(-50%,-50%); }

  #shootBtn { position: absolute; right: 30px; bottom: 170px; width: 84px; height: 84px; border-radius: 50%; background: var(--danger); color: #fff; font-weight: 800; font-size: 13px; pointer-events: auto; border: 3px solid rgba(255,255,255,.4); }
  #shootBtn:active { transform: scale(0.92); }

  #toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #toast.show { opacity: 1; }

  #lobbyList { max-width: 320px; width: 100%; font-size: 13px; opacity: .8; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- ===================== LOBBY SCREEN ===================== -->
<div id="lobbyScreen" class="screen">
  <h1>🏘️ Bagong Ilog: Hide &amp; Seek</h1>
  <p class="sub">Create a lobby to host, or join one already on your Wi-Fi</p>

  <input id="nameInput" type="text" placeholder="Your player name" maxlength="18" />

  <p class="sub" style="margin-top:10px;">Pick your Hider character (used if you're not the Seeker)</p>
  <div id="charGrid" class="char-grid"></div>

  <div class="lobby-actions">
    <button id="hostBtn">📡 Create Lobby</button>
    <button id="browseBtn" class="secondary">🔍 Browse Lobbies</button>
  </div>
  <div id="hostStatus" class="sub hidden"></div>

  <div id="browseResults" class="hidden"></div>

  <p class="sub" style="margin-top:6px;">or enter a host's IP manually:</p>
  <input id="ipInput" type="text" placeholder="Host Local IP, e.g. 192.168.1.14" />
  <button id="connectBtn" class="secondary">Connect</button>

  <div id="lobbyList"></div>
  <button id="startBtn" class="secondary hidden">Start Round (Host)</button>
</div>

<!-- ===================== ROUND OVER SCREEN ===================== -->
<div id="roundOverScreen" class="screen hidden">
  <h1 id="roundOverTitle">Round Over</h1>
  <p class="sub" id="roundOverSub"></p>
  <button id="playAgainBtn">Back to Lobby</button>
</div>

<!-- ===================== IN-GAME HUD ===================== -->
<div id="hud" class="hidden">
  <div class="top-bar">
    <div id="rolePill">—</div>
    <div id="timerPill">--:--</div>
  </div>

  <div id="blindOverlay" class="hidden">
    🚓 Eyes closed, Officer!<br/>Hiders are finding their spots...
  </div>

  <div id="moveZone" class="joystick-zone"><div class="joystick-knob"></div></div>
  <div id="lookZone" class="joystick-zone"><div class="joystick-knob"></div></div>
  <button id="shootBtn" class="hidden">🔫<br/>SHOOT</button>

  <div id="toast"></div>
</div>

<script type="module" src="game.js"></script>
</body>
</html>
